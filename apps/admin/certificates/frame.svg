<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131" preserveAspectRatio="none">
  <defs>
    <pattern id="lace" width="28" height="28" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A24A" stroke-width="1.1">
        <path d="M14 3 C20 3 24 8 24 14 C24 20 20 25 14 25 C8 25 4 20 4 14 C4 8 8 3 14 3 Z"/>
        <circle cx="14" cy="14" r="4.4"/>
        <path d="M0 14 C4 8 10 8 14 14 C18 20 24 20 28 14"/>
        <circle cx="0" cy="0" r="1.7"/>
        <circle cx="28" cy="0" r="1.7"/>
        <circle cx="0" cy="28" r="1.7"/>
        <circle cx="28" cy="28" r="1.7"/>
      </g>
    </pattern>

    <pattern id="waveH" width="28" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q7 1 14 6 T28 6" fill="none" stroke="#C9A24A" stroke-width="1.3"/>
    </pattern>

    <pattern id="waveV" width="12" height="28" patternUnits="userSpaceOnUse">
      <path d="M6 0 Q1 7 6 14 T6 28" fill="none" stroke="#C9A24A" stroke-width="1.3"/>
    </pattern>

    <ellipse id="petal" cx="800" cy="315" rx="26" ry="80"/>
  </defs>

  <rect width="1600" height="1131" fill="#FBF8EC"/>

  <!-- Watermark rosette, faint gold behind the title -->
  <g opacity=".05" fill="none" stroke="#C9A24A">
    <circle cx="800" cy="565" r="300" stroke-width="2"/>
    <circle cx="800" cy="565" r="252" stroke-width="1"/>
    <circle cx="800" cy="565" r="196" stroke-width="2"/>
    <circle cx="800" cy="565" r="120" stroke-width="1.5"/>
    <use href="#petal"/>
    <use href="#petal" transform="rotate(15 800 565)"/>
    <use href="#petal" transform="rotate(30 800 565)"/>
    <use href="#petal" transform="rotate(45 800 565)"/>
    <use href="#petal" transform="rotate(60 800 565)"/>
    <use href="#petal" transform="rotate(75 800 565)"/>
    <use href="#petal" transform="rotate(90 800 565)"/>
    <use href="#petal" transform="rotate(105 800 565)"/>
    <use href="#petal" transform="rotate(120 800 565)"/>
    <use href="#petal" transform="rotate(135 800 565)"/>
    <use href="#petal" transform="rotate(150 800 565)"/>
    <use href="#petal" transform="rotate(165 800 565)"/>
    <use href="#petal" transform="rotate(180 800 565)"/>
    <use href="#petal" transform="rotate(195 800 565)"/>
    <use href="#petal" transform="rotate(210 800 565)"/>
    <use href="#petal" transform="rotate(225 800 565)"/>
    <use href="#petal" transform="rotate(240 800 565)"/>
    <use href="#petal" transform="rotate(255 800 565)"/>
    <use href="#petal" transform="rotate(270 800 565)"/>
    <use href="#petal" transform="rotate(285 800 565)"/>
    <use href="#petal" transform="rotate(300 800 565)"/>
    <use href="#petal" transform="rotate(315 800 565)"/>
    <use href="#petal" transform="rotate(330 800 565)"/>
    <use href="#petal" transform="rotate(345 800 565)"/>
  </g>

  <!-- Outer bead edge -->
  <rect x="14" y="14" width="1572" height="1103" fill="none" stroke="#C9A24A"
        stroke-width="15" stroke-linecap="round" stroke-dasharray="0.1 24" opacity=".55"/>

  <!-- Lace band -->
  <rect x="34" y="34" width="1532" height="1063" fill="none" stroke="url(#lace)" stroke-width="44"/>

  <!-- Guilloche wave, four sides -->
  <rect x="62" y="60" width="1476" height="12" fill="url(#waveH)"/>
  <rect x="62" y="1059" width="1476" height="12" fill="url(#waveH)"/>
  <rect x="60" y="62" width="12" height="1007" fill="url(#waveV)"/>
  <rect x="1528" y="62" width="12" height="1007" fill="url(#waveV)"/>

  <!-- Inner frame, two rules -->
  <rect x="90" y="90" width="1420" height="951" fill="none" stroke="#C9A24A" stroke-width="2.4"/>
  <rect x="99" y="99" width="1402" height="933" fill="none" stroke="#C9A24A" stroke-width="1"/>
</svg>
