name = "tnec-placement-test"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "3bf7833afb71015dd06ad9e52411ff78"

# Static app. The Worker runs first for the APIs and for the dashboard pages,
# so /admin can check the session before any page is served.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "tnec-placement-test"
database_id = "11da0168-b41d-4fad-a581-efe06ff6f474"
migrations_dir = "migrations"

# Cloudflare Email Sending. The sending domain must be onboarded first.
[[send_email]]
name = "SEND_EMAIL"

[vars]
RESULT_FROM_EMAIL = "Titik Nol English Course <placement@index-now.dev>"
# AttCos WhatsApp. The API key is a secret: npx wrangler secret put ATTCOS_API_KEY
ATTCOS_API_BASE = "https://csq-api.onrender.com/api/v1"
ATTCOS_CHANNEL_ID = "6a94705f-8df3-47e7-9262-639637209fc5"
